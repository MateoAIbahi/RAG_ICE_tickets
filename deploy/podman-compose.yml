version: "3.9"

services:
  db:
    image: postgres:17
    container_name: rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    container_name: rag-api
    env_file:
      - ../.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  ingestion:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    container_name: rag-ingestion
    env_file:
      - ../.env
    depends_on:
      - db
    command: ["python", "-m", "src.ingestion.runner"]

volumes:
  db_data:
