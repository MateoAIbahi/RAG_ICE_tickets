services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d:ro
  ingestion:
    build:
      context: .
      dockerfile: deploy/ingestion.Dockerfile
    environment:
      RAG_DATABASE_URL: postgresql://rag:ragpass@db:5432/ragdb
      ERP_DATABASE_URL: ${ERP_DATABASE_URL-}
      EMBED_MODEL: Metric-AI/ColQwen2.5-3b-multilingual-v1.0
      DEVICE: cpu
      HF_HOME: /models/hf
      PROBE_ONLY: "1"

      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./data/models:/models
    depends_on:
      - db
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: rag_web
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  pgdata: