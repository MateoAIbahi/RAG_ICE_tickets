services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: rag
      # Ne s'applique qu'à la création du volume. Pour une base existante :
      # ALTER USER rag PASSWORD '...'; puis mettre la même valeur dans .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ragdb
    ports:
      - "127.0.0.1:5432:5432"   # plus exposé sur le réseau
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: rag_api
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-ragpass}@db:5432/ragdb
      HF_HOME: /models/hf
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - /data/uploads:/data/uploads
      - /data/archive:/data/archive:ro
      - /data/state:/data/state:ro      # drapeau du mode maintenance
      - /data/models:/models

  # Job ponctuel : NE démarre PAS avec `up -d`. Lancé le vendredi soir par
  # deploy/run_ingestion.sh (timer systemd ou cron), puis le conteneur s'arrête
  # et libère sa RAM.
  ingestion:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: deploy/ingestion.Dockerfile
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-ragpass}@db:5432/ragdb
      HF_HOME: /models/hf
    command: ["python", "-m", "src.ingestion.sync"]
    restart: "no"
    volumes:
      - /data/uploads:/data/uploads
      - /data/archive:/data/archive
      - /data/models:/models
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: rag_web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
