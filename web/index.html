<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAG ICE - Tickets / PDF</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .row { margin: 14px 0; }
    textarea { width: 100%; height: 90px; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
    .box { background:#f6f6f6; padding: 12px; white-space: pre-wrap; border-radius: 6px; }
    label { margin-right: 14px; }
  </style>
</head>
<body>
  <h1>RAG ICE</h1>
  <div>Choisis la source : tickets / PDF / les deux.</div>

  <div class="row">
    <textarea id="question" placeholder="Pose ta question..."></textarea>
  </div>

  <div class="row">
    <label><input type="checkbox" id="src_ticket" checked> Tickets</label>
    <label><input type="checkbox" id="src_pdf" checked> PDF</label>
  </div>

  <div class="row">
    <button id="btn">Rechercher</button>
  </div>

  <h3>Résultat</h3>
  <div class="box" id="out">-</div>

  <script>
    const out = document.getElementById("out");
    document.getElementById("btn").addEventListener("click", async () => {
      const q = document.getElementById("question").value.trim();
      const sources = [];
      if (document.getElementById("src_ticket").checked) sources.push("ticket");
      if (document.getElementById("src_pdf").checked) sources.push("pdf");

      if (!q) { out.textContent = "⚠️ Mets une question."; return; }
      if (sources.length === 0) { out.textContent = "⚠️ Sélectionne au moins une source."; return; }

      out.textContent = "⏳ Recherche...";
      try {
        const resp = await fetch("/api/search", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ question: q, sources })
        });
        const data = await resp.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = "❌ Erreur: " + e;
      }
    });
  </script>
</body>
</html>
