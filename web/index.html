<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAG ICE - Tickets / PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 24px 0;
    }

    .tab-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 14px;
    }

    .tab-btn.active {
      background: #2563eb;
      color: white;
    }

    .tab-content {
      display: none;
      margin-top: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .row {
      margin: 14px 0;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button.action-btn {
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
    }

    button.action-btn:hover {
      background: #1d4ed8;
    }

    .box {
      background: #f6f6f6;
      padding: 12px;
      white-space: pre-wrap;
      border-radius: 8px;
      border: 1px solid #ddd;
      min-height: 60px;
    }

    label {
      margin-right: 14px;
    }

    input[type="file"] {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>RAG ICE</h1>
  <p>Recherche dans les tickets et les PDF, et ajout de nouveaux documents PDF à la base.</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('searchTab', this)">Recherche</button>
    <button class="tab-btn" onclick="showTab('uploadTab', this)">Ajouter des documents</button>
  </div>

  <!-- Onglet recherche -->
  <div id="searchTab" class="tab-content active">
    <div>Choisis la source : tickets / PDF / les deux.</div>

    <div class="row">
      <textarea id="question" placeholder="Pose ta question..."></textarea>
    </div>

    <div class="row">
      <label><input type="checkbox" id="src_ticket" checked> Tickets</label>
      <label><input type="checkbox" id="src_pdf" checked> PDF</label>
    </div>

    <div class="row">
      <button class="action-btn" id="btnSearch">Rechercher</button>
    </div>

    <h3>Résultat</h3>
    <div class="box" id="searchOut">-</div>
  </div>

  <!-- Onglet upload -->
  <div id="uploadTab" class="tab-content">
    <div>Ajoute un ou plusieurs fichiers PDF qui seront ensuite ingérés dans la base.</div>

    <div class="row">
      <input type="file" id="pdfFiles" accept=".pdf" multiple />
    </div>

    <div class="row">
      <button class="action-btn" id="btnUpload">Uploader les PDF</button>
    </div>

    <h3>Statut upload</h3>
    <div class="box" id="uploadOut">-</div>
  </div>

  <script>
    function showTab(tabId, buttonEl) {
      document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.remove("active");
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      document.getElementById(tabId).classList.add("active");
      buttonEl.classList.add("active");
    }

    // Partie recherche (inchangée)
    const searchOut = document.getElementById("searchOut");

    document.getElementById("btnSearch").addEventListener("click", async () => {
      const q = document.getElementById("question").value.trim();
      const sources = [];

      if (document.getElementById("src_ticket").checked) sources.push("ticket");
      if (document.getElementById("src_pdf").checked) sources.push("pdf");

      if (!q) {
        searchOut.textContent = "⚠️ Mets une question.";
        return;
      }

      if (sources.length === 0) {
        searchOut.textContent = "⚠️ Sélectionne au moins une source.";
        return;
      }

      searchOut.textContent = "⏳ Recherche...";
      try {
        const resp = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, sources })
        });

        const data = await resp.json();
        searchOut.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        searchOut.textContent = "❌ Erreur: " + e;
      }
    });

    // Partie upload PDF
    const uploadOut = document.getElementById("uploadOut");

    document.getElementById("btnUpload").addEventListener("click", async () => {
      const files = document.getElementById("pdfFiles").files;

      if (!files.length) {
        uploadOut.textContent = "⚠️ Sélectionne au moins un fichier PDF.";
        return;
      }

      const formData = new FormData();

      for (const file of files) {
        formData.append("files", file);
      }

      uploadOut.textContent = "⏳ Upload en cours...";

      try {
        const resp = await fetch("/api/upload-pdf", {
          method: "POST",
          body: formData
        });

        const data = await resp.json();

        if (!resp.ok) {
          uploadOut.textContent = "❌ Erreur upload :\n" + JSON.stringify(data, null, 2);
          return;
        }

        uploadOut.textContent =
          "✅ Upload terminé.\n\n" +
          JSON.stringify(data, null, 2) +
          "\n\nEnsuite, lance l’ingestion sur la VM avec :\n" +
          "docker compose run --rm ingestion";
      } catch (e) {
        uploadOut.textContent = "❌ Erreur upload: " + e;
      }
    });
  </script>
</body>
</html>
