<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG ICE</title>

<style>
body {
    font-family: Arial;
    max-width: 1000px;
    margin: 40px auto;
}

textarea {
    width: 100%;
    height: 100px;
}

.box {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    white-space: pre-wrap;
}

.tabs button {
    margin-right: 10px;
}

select {
    padding: 6px;
}
</style>
</head>

<body>

<h1>RAG ICE</h1>

<div class="tabs">
<button onclick="showTab('searchTab')">Recherche</button>
<button onclick="askUploadPassword()">Ajouter des documents</button>
<button onclick="showDocsTab()">Documents ingérés</button>
</div>

<div id="searchTab">

<p>Choisis la source :</p>

<label><input type="checkbox" id="src_ticket" checked> Tickets</label>
<label><input type="checkbox" id="src_pdf" checked> PDF</label>
<label><input type="checkbox" id="src_mantis" checked> Mantis</label>

<p>Version PCCN :</p>

<select id="pccn_version_search">
<option value="">Toutes</option>
<option value="V1">V1</option>
<option value="V2">V2</option>
<option value="V3">V3</option>
</select>

<p>Question :</p>

<textarea id="question"></textarea>

<br><br>

<button id="btnSearch">Rechercher</button>

<h3>Résultat</h3>

<div class="box" id="searchOut">-</div>

</div>

<div id="uploadTab" style="display:none">

<p>Ajouter des documents (.pdf, .doc, .docx, .odt) :</p>

<input
    type="file"
    id="docFiles"
    accept=".pdf,.doc,.docx,.odt"
    multiple
>

<p>Version PCCN associée aux documents uploadés :</p>

<select id="pccn_version_upload">
<option value="">Choisir une version</option>
<option value="V1">V1</option>
<option value="V2">V2</option>
<option value="V3">V3</option>
</select>

<br><br>

<button id="btnUpload">Uploader les documents</button>

<h3>Statut upload</h3>

<div class="box" id="uploadOut">-</div>

</div>

<div id="docsTab" style="display:none">
<h3>Documents ingérés</h3>
<div class="box" id="docsOut">-</div>
</div>

<script>

function showTab(tab) {
    document.getElementById("searchTab").style.display = "none"
    document.getElementById("uploadTab").style.display = "none"
    document.getElementById("docsTab").style.display = "none"
    document.getElementById(tab).style.display = "block"
}

function askUploadPassword() {
    const password = prompt("Mot de passe requis pour ajouter des documents :")

    if (password === "icetickets") {
        showTab("uploadTab")
    } else if (password !== null) {
        alert("Mot de passe incorrect.")
    }
}
// SEARCH
const searchOut = document.getElementById("searchOut")

document.getElementById("btnSearch").addEventListener("click", async () => {
    const q = document.getElementById("question").value.trim()
    const sources = []

    if (document.getElementById("src_ticket").checked) sources.push("ticket")
    if (document.getElementById("src_pdf").checked) sources.push("pdf")
    if (document.getElementById("src_mantis").checked) sources.push("mantis")
    const version = document.getElementById("pccn_version_search").value

    let sourceType = "all"
    if (sources.length === 1) {
        sourceType = sources[0]
    }

    if (!q) {
        searchOut.textContent = "⚠️ Mets une question."
        return
    }

    if (sources.length === 0) {
        searchOut.textContent = "⚠️ Sélectionne au moins une source."
        return
    }

    searchOut.textContent = "⏳ Recherche..."

    try {
        const resp = await fetch("/api/ask", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                query: q,
                source_type: sourceType,
                pccn_version: version || null
            })
        })

        const data = await resp.json()

        if (data.answer) {
            let html = `<strong>Réponse :</strong><br><br>${data.answer}`

            if (data.sources && data.sources.length > 0) {
                const titre = data.sources.length > 1 ? "Sources :" : "Source :"
                html += `<br><br><strong>${titre}</strong><ul style="list-style:none;padding-left:0">`
                for (const src of data.sources) {
                    const page = src.page_num !== null && src.page_num !== undefined
                        ? ` - page ${src.page_num}`
                        : ""
                    html += `<li>${src.index}) ${src.source_path}${page}</li>`
                }
                html += `</ul>`
            }

            searchOut.innerHTML = html
        } else {
            searchOut.textContent = "Aucune réponse générée."
        }

    } catch (e) {
        searchOut.textContent = "❌ Erreur: " + e
    }
})

// UPLOAD
const uploadOut = document.getElementById("uploadOut")

document.getElementById("btnUpload").addEventListener("click", async () => {
    const files = document.getElementById("docFiles").files
    const version = document.getElementById("pccn_version_upload").value

    if (!files.length) {
        uploadOut.textContent = "⚠️ Sélectionne au moins un document."
        return
    }

    if (!version) {
        uploadOut.textContent = "⚠️ Choisis une version PCCN."
        return
    }

    const formData = new FormData()

    for (const file of files) {
        formData.append("files", file)
    }

    formData.append("pccn_version", version)

    uploadOut.textContent = "⏳ Upload en cours..."

    try {
        const resp = await fetch("/api/upload-pdf", {
            method: "POST",
            body: formData
        })

        const data = await resp.json()
        uploadOut.textContent = JSON.stringify(data, null, 2)

    } catch (e) {
        uploadOut.textContent = "❌ Erreur upload: " + e
    }
})

function showDocsTab() {
    showTab("docsTab")
    loadDocs()
}

async function loadDocs() {
    const out = document.getElementById("docsOut")
    out.textContent = "⏳ Chargement..."

    try {
        const resp = await fetch("/api/documents")
        const data = await resp.json()
        const docs = data.documents

        if (!docs || docs.length === 0) {
            out.textContent = "Aucun document ingéré."
            return
        }

        const totalPages = docs.reduce((s, d) => s + d.chunks, 0)

        let html = `<p>${docs.length} document(s) — ${totalPages} pages indexées</p>`
        html += `<table border="1" cellpadding="6" style="border-collapse:collapse">`
        html += `<tr><th>Document</th><th>Version</th><th>Pages</th><th>Ingéré le</th><th>Action</th></tr>`

        for (const d of docs) {
            const safeId = d.source_id.replace(/'/g, "\\'")
            html += `<tr>`
            html += `<td>${d.source_path}</td>`
            html += `<td>${d.pccn_version || "-"}</td>`
            html += `<td>${d.chunks}</td>`
            html += `<td>${d.ingere_le}</td>`
            html += `<td><button onclick="deleteDoc('${safeId}', ${d.chunks})">Supprimer</button></td>`
            html += `</tr>`
        }

        html += `</table>`
        out.innerHTML = html

    } catch (e) {
        out.textContent = "❌ Erreur: " + e
    }
}

async function deleteDoc(sourceId, chunks) {
    if (!confirm(`Supprimer "${sourceId}" (${chunks} pages) de la base de recherche ?\n\nLe document ne sera plus utilisé pour répondre aux questions.`)) return

    const password = prompt("Mot de passe :")
    if (!password) return

    try {
        const resp = await fetch("/api/documents/delete", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({source_id: sourceId, password: password})
        })
        if (!resp.ok) {
            const err = await resp.json()
            alert("❌ " + (err.detail || resp.status))
            return
        }
        loadDocs()
    } catch (e) {
        alert("❌ Erreur: " + e)
    }
}

</script>

</body>
</html>
